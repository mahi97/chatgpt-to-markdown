<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; margin: 0; padding: 14px; font: 13px/1.4 system-ui, sans-serif; color: #202123; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  button { width: 100%; padding: 9px; margin-bottom: 8px; border: 0; border-radius: 6px; font-size: 13px; cursor: pointer; background: #10a37f; color: #fff; }
  button.secondary { background: #ececf1; color: #202123; }
  button:disabled { opacity: .6; cursor: default; }
  label { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; }
  #status { min-height: 18px; font-size: 12px; color: #555; }
  #status.err { color: #c0392b; }
</style>
</head>
<body>
  <h1>ChatGPT → Markdown</h1>
  <label><input type="checkbox" id="ts"> Include message timestamps</label>
  <button id="download">Download .md</button>
  <button id="copy" class="secondary">Copy to clipboard</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
